<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Responder cotação</title>
  <style>
    :root { --azul: #0f3d6e; --borda: #d5dbe1; --suave: #5b6876; --fundo: #f4f6f8; --perigo: #b42318; --ok: #157347; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1f2933; background: var(--fundo); }
    header { background: var(--azul); color: #fff; padding: 16px; }
    header h1 { margin: 0; font-size: 19px; } header div { opacity: .85; font-size: 13px; }
    main { max-width: 860px; margin: 0 auto; padding: 16px; }
    .cartao { background: #fff; border: 1px solid var(--borda); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    .suave { color: var(--suave); font-size: 13px; }
    .item { border-top: 1px solid var(--borda); padding: 14px 0; } .item:first-of-type { border-top: 0; padding-top: 0; }
    .item .tit { font-weight: 700; } .item .desc { white-space: pre-wrap; margin: 4px 0 8px; }
    .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    input, select, textarea { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid var(--borda); border-radius: 8px; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #8fb4e3; border-color: var(--azul); }
    button { font: inherit; font-weight: 700; background: var(--azul); color: #fff; border: 0; border-radius: 8px; padding: 12px 18px; width: 100%; cursor: pointer; }
    button:disabled { opacity: .6; }
    .aviso { padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; }
    .aviso.erro { background: #fde8e7; color: var(--perigo); } .aviso.ok { background: #e3f4ea; color: var(--ok); } .aviso.info { background: #e8f0fb; color: var(--azul); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; font-size: 14px; } dt { color: var(--suave); } dd { margin: 0; }
    @media (max-width: 560px) { .grade { grid-template-columns: 1fr; } dl { grid-template-columns: 1fr; } dt { margin-top: 6px; } }
  </style>
</head>
<body>
  <header><h1>Responder cotação</h1><div id="sub">Carregando…</div></header>
  <main id="conteudo"></main>
  <script type="module" src="/js/cotar.js"></script>
</body>
</html>
